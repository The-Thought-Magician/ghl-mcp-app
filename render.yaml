# Render.com deployment configuration for GoHighLevel MCP Server

services:
  - type: web
    name: ghl-mcp-server
    env: python
    plan: starter  # Free tier
    buildCommand: "echo 'Dependencies will be installed from requirements.txt'"
    startCommand: "./start-render.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MCP_TRANSPORT
        value: "http"
      - key: MCP_HOST
        value: "0.0.0.0"
      # Add your GoHighLevel credentials as environment variables in Render dashboard:
      # - GHL_API_KEY (set in Render dashboard)
      # - GHL_LOCATION_ID (set in Render dashboard)
      # - GHL_BASE_URL (optional, defaults to official API)
    
    # Health check endpoint
    healthCheckPath: "/health"
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Disk storage for cloned documentation
    disk:
      name: docs-storage
      mountPath: /opt/render/project/src/docs
      sizeGB: 1
